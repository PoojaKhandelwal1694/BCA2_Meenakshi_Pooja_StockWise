
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | StockWise</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='15' fill='%23e8d5a5'/%3E%3Ctext x='32' y='45' font-family='Arial,sans-serif' font-size='42' font-weight='bold' text-anchor='middle' fill='%230d493b'%3ES%3C/text%3E%3C/svg%3E">

    <link rel="stylesheet" href="auth.css">
</head>

<body>

    <main class="auth-container">

        <section class="form-box">

            <div class="brand">
                <span class="brand-icon">S</span>
                <span>StockWise</span>
            </div>

            <h1>Welcome back!</h1>

            <p class="subtitle">
                Log in to manage your inventory with ease.
            </p>

            <form id="loginForm">

                <label for="email">Email Address</label>
                <input
                    type="email"
                    id="email"
                    placeholder="you@example.com"
                    required
                >

                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    required
                >

                <button type="submit">Log In <span>→</span></button>

                <p id="message" role="status"></p>

            </form>

            <p class="switch-page">
                Don't have an account?
                <a href="signup.html">Sign up</a>
            </p>

            <p class="footer-text">SMART INVENTORY MANAGEMENT</p>

        </section>

    </main>

    <script src="auth.js"></script>

</body>
</html>
